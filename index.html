<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yokukichi.and.capybara</title>
<meta name="description" content="Yokukichi.and.capybara 公式ポートフォリオ・リンクサイト">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     CONFIG NOTE: To change link URLs, edit the LINKS object
     near the top of the <script> block at the bottom of this file.
     To change copy text, edit the I18N object in the same script.
     ============================================================ */

  :root{
    --bg-deep:   #0b0414;
    --bg-mid:    #1c0a33;
    --bg-purple: #341257;
    --accent:    #9d4edd;
    --accent-soft: #c8a2ff;
    --accent-dim:  #5a2a8c;
    --ink:       #f2ecff;
    --ink-dim:   #b9a8d9;
    --btn-bg:    #0c0a12;
    --btn-border: rgba(157, 78, 221, 0.35);
    --star:      #e7defc;
    --focus-ring: #c8a2ff;
    --font-display: 'Space Grotesk', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    --font-body: 'Inter', 'Hiragino Sans', 'Yu Gothic', sans-serif;
  }

  *{ box-sizing: border-box; }
  html, body{
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg-deep);
  }
  body{
    font-family: var(--font-body);
    color: var(--ink);
    overflow-x: hidden;
    position: relative;
  }

  a{ color: inherit; }

  /* ---------- Background: gradient + stars ---------- */
  .sky{
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(157,78,221,0.20), transparent 55%),
      radial-gradient(ellipse at 85% 15%, rgba(120,60,200,0.18), transparent 50%),
      linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 45%, var(--bg-purple) 78%, var(--bg-mid) 100%);
    overflow: hidden;
  }
  .star{
    position: absolute;
    top: var(--y);
    left: var(--x);
    width: var(--s);
    height: var(--s);
    background: var(--star);
    border-radius: 50%;
    opacity: var(--o);
    box-shadow: 0 0 6px 1px rgba(232, 220, 255, 0.5);
    animation: twinkle var(--dur) ease-in-out infinite alternate, drift var(--ddur) ease-in-out infinite alternate;
    animation-delay: var(--delay), var(--delay);
    will-change: opacity, transform;
  }
  @keyframes twinkle{
    from{ opacity: calc(var(--o) * 0.25); }
    to{ opacity: var(--o); }
  }
  @keyframes drift{
    from{ transform: translate(0, 0); }
    to{ transform: translate(6px, -8px); }
  }

  /* ---------- Opening animation ---------- */
  #opening{
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-deep);
    opacity: 0;
    animation: openFade 2.4s ease-in-out forwards;
    pointer-events: none;
  }
  #opening .mark{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(1.6rem, 6vw, 3rem);
    letter-spacing: 0.01em;
    color: var(--ink);
    text-shadow: 0 0 24px rgba(157,78,221,0.55);
  }
  @keyframes openFade{
    0%   { opacity: 0; }
    28%  { opacity: 1; }
    68%  { opacity: 1; }
    100% { opacity: 0; }
  }

  #main{
    position: relative;
    z-index: 1;
    opacity: 0;
    animation: mainReveal 1.4s ease-out forwards;
    animation-delay: 1.5s;
  }
  @keyframes mainReveal{
    to{ opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce){
    #opening{ animation: none; opacity: 0; display: none; }
    #main{ animation: none; opacity: 1; }
    .star{ animation: none; opacity: var(--o); }
  }

  /* ---------- Layout ---------- */
  .lang-toggle{
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 20;
    display: flex;
    background: rgba(12, 10, 18, 0.55);
    border: 1px solid var(--btn-border);
    border-radius: 999px;
    padding: 3px;
    backdrop-filter: blur(6px);
  }
  .lang-toggle button{
    font-family: var(--font-body);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--ink-dim);
    background: transparent;
    border: none;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease;
  }
  .lang-toggle button.active{
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    color: #fff;
  }
  .lang-toggle button:focus-visible{
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  .wrap{
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 96px 20px 40px;
  }

  .hero{
    text-align: center;
    max-width: 640px;
  }
  .hero h1{
    font-family: var(--font-display);
    font-size: clamp(1.9rem, 6vw, 3rem);
    font-weight: 700;
    margin: 0 0 14px;
    line-height: 1.15;
    background: linear-gradient(120deg, var(--accent-soft), var(--accent) 60%, #7cb3ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero p{
    font-size: 0.98rem;
    color: var(--ink-dim);
    line-height: 1.7;
    margin: 0;
  }
  [data-i18n-fade]{ transition: opacity 0.18s ease; }

  .links{
    width: 100%;
    max-width: 420px;
    margin-top: 42px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .link-btn{
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 15px 20px;
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    border-radius: 16px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    text-decoration: none;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 0.98rem;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .link-btn:hover, .link-btn:focus-visible{
    transform: translateY(-2px) scale(1.015);
    border-color: rgba(200, 162, 255, 0.75);
    box-shadow: 0 10px 26px rgba(0,0,0,0.5), 0 0 26px rgba(157,78,221,0.45);
  }
  .link-btn:focus-visible{
    outline: 2px solid var(--focus-ring);
    outline-offset: 3px;
  }
  .link-btn:active{ transform: translateY(0) scale(0.99); }
  .link-btn .icon{
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    color: var(--accent-soft);
  }
  .link-btn .icon svg{ width: 100%; height: 100%; }
  .link-btn .label{ flex: 1; text-align: left; }

  @media (min-width: 480px){
    .link-btn{ padding: 16px 22px; }
  }

  /* touch target comfort */
  @media (max-width: 480px){
    .link-btn{ padding: 16px 18px; font-size: 1rem; }
  }

  .about{
    max-width: 560px;
    margin-top: 56px;
    padding: 22px 24px;
    border: 1px solid rgba(157,78,221,0.22);
    border-radius: 18px;
    background: rgba(20, 10, 34, 0.4);
    text-align: center;
  }
  .about h2{
    font-family: var(--font-display);
    font-size: 1.05rem;
    margin: 0 0 10px;
    color: var(--accent-soft);
  }
  .about p{
    font-size: 0.9rem;
    line-height: 1.75;
    color: var(--ink-dim);
    margin: 0;
  }

  footer{
    margin-top: 56px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 0.78rem;
    line-height: 1.9;
    opacity: 0.85;
  }
  footer .notice{
    font-size: 0.72rem;
    opacity: 0.75;
  }
</style>
</head>
<body>

<div id="opening" aria-hidden="true">
  <div class="mark">Yokukichi.and.capybara</div>
</div>

<div class="sky" id="sky"></div>

<div class="lang-toggle" role="group" aria-label="Language / 言語切り替え">
  <button type="button" id="lang-jp" class="active" aria-pressed="true">JP</button>
  <button type="button" id="lang-en" aria-pressed="false">EN</button>
</div>

<div id="main">
  <div class="wrap">
    <div class="hero">
      <h1>Yokukichi.and.capybara</h1>
      <p data-i18n-fade data-i18n="tagline"></p>
    </div>

    <nav class="links" aria-label="Links">
      <a class="link-btn" data-key="discord" href="#" target="_blank" rel="noopener noreferrer">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="7" width="18" height="12" rx="6"/>
            <circle cx="9" cy="13" r="1.2" fill="currentColor" stroke="none"/>
            <circle cx="15" cy="13" r="1.2" fill="currentColor" stroke="none"/>
            <path d="M7 7c0-2 2-3.5 5-3.5s5 1.5 5 3.5"/>
          </svg>
        </span>
        <span class="label">Discord</span>
      </a>

      <a class="link-btn" data-key="tiktok" href="#" target="_blank" rel="noopener noreferrer">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 4v10.5a3.5 3.5 0 1 1-3-3.46"/>
            <path d="M14 4c0 3 2 5 5 5"/>
          </svg>
        </span>
        <span class="label">TikTok</span>
      </a>

      <a class="link-btn" data-key="youtube" href="#" target="_blank" rel="noopener noreferrer">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="6" width="18" height="12" rx="4"/>
            <path d="M11 10l4 2-4 2z" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="label">YouTube</span>
      </a>

      <a class="link-btn" data-key="request" href="#" target="_blank" rel="noopener noreferrer">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9.5L6 7l1.5 2 2-2.2L11 9l2-2.2 1.5 2.2 3-2.5"/>
            <rect x="3" y="9.5" width="18" height="10.5" rx="2"/>
          </svg>
        </span>
        <span class="label" data-i18n="btn_request"></span>
      </a>

      <a class="link-btn" data-key="about" href="#about-section">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <line x1="12" y1="11" x2="12" y2="16.5"/>
            <circle cx="12" cy="7.7" r="0.9" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="label" data-i18n="btn_about"></span>
      </a>
    </nav>

    <section class="about" id="about-section">
      <h2 data-i18n="about_heading"></h2>
      <p data-i18n-fade data-i18n="about_body"></p>
    </section>

    <footer>
      <div>&copy; Yokukichi.and.capybara</div>
      <div class="notice" data-i18n-fade data-i18n="ai_notice"></div>
    </footer>
  </div>
</div>

<script>
(function(){

  /* ============================================================
     EDIT HERE: link destinations.
     Replace "#" with the real URL when it is ready.
     Anything starting with "#" scrolls smoothly to that section
     on this page instead of navigating away.
     ============================================================ */
  const LINKS = {
    discord: "https://discord.gg/Mq6Tp3PDv7",   // e.g. "https://discord.gg/xxxxxxx"
    tiktok:  "https://www.tiktok.com/@yokukichi.and.capybara?_r=1&_t=ZS-99f5ZBaduLs",   // e.g. "https://www.tiktok.com/@yourhandle"
    youtube: "https://youtube.com/@yokukichi.and.capybara-i6z?si=hVNV2BToSFCKywqo",   // e.g. "https://www.youtube.com/@yourhandle"
    request: "https://drive.google.com/file/d/1SXZE3P_GkL0o-M_fKlNdUZRlJM0ua2OF/view?usp=drivesdk",   // e.g. form or contact page for video-editing requests
    about:   "#about-section"
  };

  /* ============================================================
     EDIT HERE: page copy, per language.
     ============================================================ */
  const I18N = {
    jp: {
      tagline: "edit動画サービスとクリエイター活動をまとめた、Yokukichi.and.capybaraの公式リンクサイトです。",
      btn_request: "edit動画のご依頼",
      btn_about: "Yokukichi.and.capybaraについて",
      about_heading: "About",
      about_body: "よくきちが運営する個人クリエイターブランド「Yokukichi.and.capybara」。edit動画の受注や、TikTok・YouTubeでの創作活動を行っています。",
      ai_notice: "このサイトはAIで作られたものです。"
    },
    en: {
      tagline: "The official link hub for Yokukichi.and.capybara's video-editing services and creator projects.",
      btn_request: "Request a edit video",
      btn_about: "About Yokukichi.and.capybara",
      about_heading: "About",
      about_body: "Yokukichi.and.capybara is an independent creator brand run by Yokukichi, offering edit video services alongside content on TikTok and YouTube.",
      ai_notice: "This website was created with AI."
    }
  };

  function applyLinks(){
    document.querySelectorAll('.link-btn[data-key]').forEach(function(el){
      const key = el.getAttribute('data-key');
      const url = LINKS[key];
      if (!url) return;
      el.setAttribute('href', url);
      if (url.startsWith('#')){
        el.removeAttribute('target');
        el.addEventListener('click', function(e){
          const target = document.querySelector(url);
          if (target){
            e.preventDefault();
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        });
      }
    });
  }

  function setLanguage(lang, animate){
    const dict = I18N[lang] || I18N.jp;
    const nodes = document.querySelectorAll('[data-i18n]');

    function fill(){
      nodes.forEach(function(el){
        const key = el.getAttribute('data-i18n');
        if (dict[key] !== undefined) el.textContent = dict[key];
      });
      document.documentElement.lang = (lang === 'en') ? 'en' : 'ja';
      document.getElementById('lang-jp').classList.toggle('active', lang !== 'en');
      document.getElementById('lang-en').classList.toggle('active', lang === 'en');
      document.getElementById('lang-jp').setAttribute('aria-pressed', String(lang !== 'en'));
      document.getElementById('lang-en').setAttribute('aria-pressed', String(lang === 'en'));
    }

    if (animate){
      const fading = document.querySelectorAll('[data-i18n-fade]');
      fading.forEach(function(el){ el.style.opacity = '0'; });
      setTimeout(function(){
        fill();
        fading.forEach(function(el){ el.style.opacity = '1'; });
      }, 180);
    } else {
      fill();
    }

    try { localStorage.setItem('ykc_lang', lang); } catch(e){}
  }

  function initLanguage(){
    let saved = 'jp';
    try { saved = localStorage.getItem('ykc_lang') || 'jp'; } catch(e){}
    setLanguage(saved, false);
    document.getElementById('lang-jp').addEventListener('click', function(){ setLanguage('jp', true); });
    document.getElementById('lang-en').addEventListener('click', function(){ setLanguage('en', true); });
  }

  function buildStars(){
    const sky = document.getElementById('sky');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const count = window.innerWidth < 600 ? 55 : 90;
    const frag = document.createDocumentFragment();
    for (let i = 0; i < count; i++){
      const s = document.createElement('div');
      s.className = 'star';
      const size = (Math.random() * 2 + 1).toFixed(1);
      s.style.setProperty('--x', (Math.random() * 100).toFixed(2) + '%');
      s.style.setProperty('--y', (Math.random() * 100).toFixed(2) + '%');
      s.style.setProperty('--s', size + 'px');
      s.style.setProperty('--o', (Math.random() * 0.6 + 0.35).toFixed(2));
      s.style.setProperty('--dur', (Math.random() * 3 + 2.5).toFixed(2) + 's');
      s.style.setProperty('--ddur', (Math.random() * 14 + 10).toFixed(2) + 's');
      s.style.setProperty('--delay', '-' + (Math.random() * 5).toFixed(2) + 's');
      if (reduce) s.style.animation = 'none';
      frag.appendChild(s);
    }
    sky.appendChild(frag);
  }

  applyLinks();
  initLanguage();
  buildStars();
})();
</script>
</body>
</html>
